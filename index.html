<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-black text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EstudoFlow PRO</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-full flex flex-col font-sans antialiased bg-black text-slate-100 select-none">

    <!-- Tela de Autenticação -->
    <div id="authScreen" class="fixed inset-0 bg-black z-50 flex items-center justify-center p-4">
        <div class="bg-zinc-950 border border-zinc-800 rounded-3xl w-full max-w-sm p-6 space-y-5 shadow-2xl">
            <div class="text-center space-y-2">
                <div class="inline-flex p-3 bg-zinc-900 border border-zinc-700 rounded-2xl text-blue-400 mb-1">
                    <i data-lucide="shield" class="w-8 h-8"></i>
                </div>
                <h1 class="text-2xl font-black text-white">EstudoFlow <span class="text-blue-500">PRO</span></h1>
                <p class="text-xs text-zinc-400" id="authSubtitle">Aceda para sincronizar em todos os dispositivos</p>
            </div>

            <!-- Botão de Login com Google -->
            <button onclick="loginWithGoogle()" class="w-full bg-zinc-900 hover:bg-zinc-800 text-white font-semibold py-3 px-4 rounded-xl text-sm border border-zinc-700 flex items-center justify-center space-x-2 transition shadow-md">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Continuar com o Google</span>
            </button>

            <div class="flex items-center space-x-2 my-2">
                <div class="flex-1 border-t border-zinc-800"></div>
                <span class="text-[10px] text-zinc-500 uppercase tracking-wider">ou e-mail</span>
                <div class="flex-1 border-t border-zinc-800"></div>
            </div>

            <form id="authForm" onsubmit="handleAuth(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-zinc-400 mb-1">E-mail</label>
                    <input type="email" id="authEmail" required placeholder="seu@email.com" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-zinc-400 mb-1">Palavra-passe</label>
                    <input type="password" id="authPassword" required placeholder="••••••••" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>

                <button type="submit" id="btnAuthSubmit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-blue-600/20">
                    Entrar
                </button>
            </form>

            <div class="text-center pt-1">
                <button onclick="toggleAuthMode()" id="btnToggleAuth" class="text-xs text-zinc-400 hover:text-white transition">
                    Não tem conta? <span class="text-blue-400 font-bold">Registe-se</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Interface Principal -->
    <div id="appInterface" class="h-full flex flex-col hidden">
        <header class="bg-black/90 backdrop-blur border-b border-zinc-800 sticky top-0 z-40 pt-2">
            <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <div class="p-2 bg-zinc-900 border border-zinc-700 rounded-xl text-blue-400">
                        <i data-lucide="shield" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-black tracking-wide text-white">
                            EstudoFlow <span class="text-blue-500">PRO</span>
                        </h1>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <span id="userEmailDisplay" class="text-xs text-zinc-400 hidden sm:inline"></span>
                    <button onclick="logout()" class="p-2 text-zinc-400 hover:text-red-400 transition border border-zinc-800 rounded-xl bg-zinc-950" title="Sair da Conta">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 pb-24 overflow-y-auto hide-scrollbar">
            <section id="tab-schedule" class="space-y-6">
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                    <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-4 space-y-1 shadow-md">
                        <div class="flex items-center justify-between text-zinc-400">
                            <span class="text-[10px] font-bold uppercase tracking-wider">Horas Totais</span>
                            <i data-lucide="clock" class="w-4 h-4 text-blue-400"></i>
                        </div>
                        <div id="statTotalHours" class="text-2xl font-black text-white">0h</div>
                    </div>
                    <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-4 space-y-2 col-span-2 lg:col-span-3 shadow-md">
                        <div class="flex justify-between items-center text-sm">
                            <span class="font-bold text-zinc-300">Progresso Geral do Edital</span>
                            <span id="globalPercent" class="font-black text-blue-500 text-base">0%</span>
                        </div>
                        <div class="w-full bg-zinc-900 h-3 rounded-full overflow-hidden border border-zinc-800">
                            <div id="globalProgressBar" class="bg-blue-600 h-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 pt-2">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-zinc-400 flex items-center space-x-1.5">
                        <i data-lucide="list-checks" class="w-4 h-4 text-blue-500"></i>
                        <span>Disciplinas</span>
                    </h2>
                    <div class="flex space-x-2 w-full sm:w-auto">
                        <button onclick="abrirModalImportacao()" class="flex-1 sm:flex-none bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded-xl text-xs font-bold flex items-center justify-center space-x-1.5 transition">
                            <i data-lucide="sparkles" class="w-4 h-4"></i>
                            <span>Importar Edital</span>
                        </button>
                        <button onclick="openSubjectModal()" class="flex-1 sm:flex-none bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 px-3 py-2 rounded-xl text-xs font-bold flex items-center justify-center space-x-1.5 transition">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            <span>Adicionar Matéria</span>
                        </button>
                    </div>
                </div>

                <div id="scheduleContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </section>
        </main>
    </div>

    <!-- Modais -->
    <div id="importModal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-zinc-950 border border-zinc-800 rounded-2xl w-full max-w-lg p-5 space-y-4 shadow-2xl">
            <h3 class="text-base font-bold text-blue-500 flex items-center space-x-2">
                <i data-lucide="sparkles" class="w-5 h-5"></i>
                <span>Importar Edital Verticalizado</span>
            </h3>
            <textarea id="editalText" rows="10" placeholder="PORTUGUÊS&#10;1. Compreensão de texto" class="w-full bg-black border border-zinc-800 rounded-xl p-3 text-sm text-white focus:outline-none resize-none font-mono"></textarea>
            <div class="flex space-x-2 pt-2">
                <button onclick="fecharModalImportacao()" class="flex-1 bg-zinc-900 text-zinc-300 py-2.5 rounded-xl text-sm font-semibold border border-zinc-800">Cancelar</button>
                <button onclick="processarEditalLocal()" class="flex-1 bg-blue-600 text-white py-2.5 rounded-xl text-sm font-semibold">Adicionar</button>
            </div>
        </div>
    </div>

    <div id="subjectModal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-zinc-950 border border-zinc-800 rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl">
            <h3 id="subjectModalTitle" class="text-base font-bold text-white">Adicionar Matéria</h3>
            <input type="text" id="modalSubjectName" placeholder="Nome da Matéria" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white">
            <textarea id="modalSubjectTopics" rows="4" placeholder="Tópicos (um por linha)" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white font-mono"></textarea>
            <div class="flex space-x-2 pt-2">
                <button onclick="closeSubjectModal()" class="flex-1 bg-zinc-900 text-zinc-300 py-2.5 rounded-xl text-sm font-semibold border border-zinc-800">Cancelar</button>
                <button onclick="saveSubject()" class="flex-1 bg-blue-600 text-white py-2.5 rounded-xl text-sm font-semibold">Salvar</button>
            </div>
        </div>
    </div>

    <div id="customAlert" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-zinc-950 border border-zinc-800 rounded-2xl w-full max-w-sm p-6 text-center space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-blue-500">EstudoFlow PRO</h3>
            <p id="customAlertMessage" class="text-sm text-zinc-300 leading-relaxed"></p>
            <button onclick="closeCustomAlert()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-sm transition">OK</button>
        </div>
    </div>

    <script>
       const firebaseConfig = {
    apiKey: "AIzaSyBCM2cfdMsNCLUltoly066qglhZnMRI86I",
    authDomain: "estudoflow-fef07.firebaseapp.com",
    projectId: "estudoflow-fef07",
    storageBucket: "estudoflow-fef07.firebasestorage.app",
    messagingSenderId: "74901576739",
    appId: "1:74901576739:web:41fb812867e19d7154e596"
};

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let isSignUpMode = false;
        let state = { subjects: [] };

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('appInterface').classList.remove('hidden');
                document.getElementById('userEmailDisplay').innerText = user.email;
                loadUserData();
            } else {
                currentUser = null;
                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('appInterface').classList.add('hidden');
            }
        });

        async function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                await auth.signInWithPopup(provider);
            } catch (error) {
                showAlert(error.message);
            }
        }

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('authSubtitle').innerText = isSignUpMode ? "Crie a sua conta gratuita" : "Aceda para sincronizar em todos os dispositivos";
            document.getElementById('btnAuthSubmit').innerText = isSignUpMode ? "Cadastrar" : "Entrar";
            document.getElementById('btnToggleAuth').innerHTML = isSignUpMode ? 'Já tem conta? <span class="text-blue-400 font-bold">Faça Login</span>' : 'Não tem conta? <span class="text-blue-400 font-bold">Registe-se</span>';
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();

            try {
                if (isSignUpMode) {
                    await auth.createUserWithEmailAndPassword(email, password);
                } else {
                    await auth.signInWithEmailAndPassword(email, password);
                }
            } catch (error) {
                showAlert(error.message);
            }
        }

        function logout() { auth.signOut(); }

        function loadUserData() {
            if (!currentUser) return;
            db.collection('schedules').doc(currentUser.uid).onSnapshot(doc => {
                if (doc.exists) {
                    state = doc.data();
                } else {
                    saveData();
                }
                render();
            });
        }

        async function saveData() {
            if (!currentUser) return;
            try {
                await db.collection('schedules').doc(currentUser.uid).set(state);
            } catch (e) {
                console.error("Erro ao guardar dados: ", e);
            }
        }

        function showAlert(mensagem) {
            document.getElementById('customAlertMessage').innerText = mensagem;
            document.getElementById('customAlert').classList.remove('hidden');
        }

        function closeCustomAlert() { document.getElementById('customAlert').classList.add('hidden'); }
        function abrirModalImportacao() { document.getElementById('importModal').classList.remove('hidden'); }
        function fecharModalImportacao() { document.getElementById('importModal').classList.add('hidden'); document.getElementById('editalText').value = ''; }

        function processarEditalLocal() {
            const rawText = document.getElementById('editalText').value.trim();
            if (!rawText) return;

            const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            let currentSubject = null;

            lines.forEach((line) => {
                const isHeading = line === line.toUpperCase() && !/^\d+[\.\)]/.test(line) && line.length < 50;
                if (isHeading || !currentSubject) {
                    currentSubject = {
                        id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
                        name: line.replace(/^\d+[\.\)]\s*/, ''),
                        topics: []
                    };
                    state.subjects.push(currentSubject);
                } else {
                    currentSubject.topics.push({
                        id: 't_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                        title: line, completed: false
                    });
                }
            });

            saveData();
            fecharModalImportacao();
        }

        function render() {
            renderSchedule();
            lucide.createIcons();
        }

        function renderSchedule() {
            const container = document.getElementById('scheduleContainer');
            container.innerHTML = '';
            let totalTopics = 0, completedTopics = 0;

            state.subjects.forEach(subject => {
                const subCompleted = subject.topics.filter(t => t.completed).length;
                const subTotal = subject.topics.length;
                totalTopics += subTotal;
                completedTopics += subCompleted;

                let topicsHtml = '';
                subject.topics.forEach(topic => {
                    topicsHtml += `
                        <div class="p-3 rounded-xl bg-black border border-zinc-800 flex items-center justify-between">
                            <label class="flex items-center space-x-2 cursor-pointer flex-1">
                                <input type="checkbox" ${topic.completed ? 'checked' : ''} onchange="toggleTopic('${subject.id}', '${topic.id}')" class="rounded bg-zinc-900 border-zinc-700 text-blue-600 w-4 h-4">
                                <span class="text-xs font-semibold ${topic.completed ? 'line-through text-zinc-600' : 'text-zinc-200'}">${topic.title}</span>
                            </label>
                        </div>`;
                });

                const card = document.createElement('div');
                card.className = "bg-zinc-950 border border-zinc-800 rounded-2xl p-4 space-y-3 shadow-md";
                card.innerHTML = `<h3 class="text-base font-bold text-white">${subject.name}</h3><div class="space-y-2 pt-1">${topicsHtml}</div>`;
                container.appendChild(card);
            });

            const globalPercent = totalTopics > 0 ? Math.round((completedTopics / totalTopics) * 100) : 0;
            document.getElementById('globalPercent').innerText = `${globalPercent}%`;
            document.getElementById('globalProgressBar').style.width = `${globalPercent}%`;
        }

        function toggleTopic(subjectId, topicId) {
            const subject = state.subjects.find(s => s.id === subjectId);
            if (!subject) return;
            const topic = subject.topics.find(t => t.id === topicId);
            if (!topic) return;
            topic.completed = !topic.completed;
            saveData();
        }

        function openSubjectModal() { document.getElementById('subjectModal').classList.remove('hidden'); }
        function closeSubjectModal() { document.getElementById('subjectModal').classList.add('hidden'); }

        function saveSubject() {
            const name = document.getElementById('modalSubjectName').value.trim();
            const rawTopics = document.getElementById('modalSubjectTopics').value.split('\n').filter(t => t.trim() !== '');
            if (!name) return;

            state.subjects.push({
                id: Date.now().toString(),
                name,
                topics: rawTopics.map((t, idx) => ({ id: 't_' + Date.now() + '_' + idx, title: t, completed: false }))
            });

            saveData();
            closeSubjectModal();
        }
    </script>
</body>
</html>
